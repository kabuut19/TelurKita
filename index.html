<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TelurKita</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="sidebar">

    <div class="logo">
        🥚 <span>TelurKita</span>
    </div>

    <ul>

        <li class="active">
            <i class="bi bi-grid-fill"></i>
            Dashboard
        </li>

        <li>
            <i class="bi bi-box-seam"></i>
            Stok
        </li>

        <li>
            <i class="bi bi-cart-fill"></i>
            Penjualan
        </li>

        <li>
            <i class="bi bi-truck"></i>
            Supplier
        </li>

        <li>
            <i class="bi bi-receipt"></i>
            Laporan
        </li>

        <li>
            <i class="bi bi-gear-fill"></i>
            Pengaturan
        </li>

    </ul>

</div>

<div class="main">

    <div class="topbar">

        <h3>Dashboard</h3>

        <div class="user">
            👤 Admin
        </div>

    </div>

    <div class="row g-4">

        <div class="col-md-3">
            <div class="card-box">
                <h5>Total Stok</h5>
                <h2>125 Rak</h2>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card-box">
                <h5>Penjualan</h5>
                <h2>Rp0</h2>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card-box">
                <h5>Piutang</h5>
                <h2>Rp0</h2>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card-box">
                <h5>Laba</h5>
                <h2>Rp0</h2>
            </div>
        </div>

    </div>

    <div class="quick-action">

        <h4>Aksi Cepat</h4>

        <button class="btn btn-warning">+ Stok Masuk</button>

        <button class="btn btn-success">+ Penjualan</button>

        <button class="btn btn-primary">Laporan</button>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
